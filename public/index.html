<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès Sécurisé - Meknès Éducation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>
    <!-- Login Modal -->
    <div id="login-overlay">
        <div class="login-box">
            <h2><i class="fa-solid fa-lock" style="color: #facc15;"></i> Accès Sécurisé</h2>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px;">Veuillez entrer la clé de déchiffrement pour accéder aux données.</p>
            <input type="password" id="login-key" placeholder="Clé secrète..." autocomplete="off">
            <button id="login-btn">
                <span id="login-btn-text">Déchiffrer</span>
                <div id="login-spinner" class="spinner hidden" style="width: 20px; height: 20px; border-width: 2px;"></div>
            </button>
            <div id="login-error"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        const loginBtn = document.getElementById('login-btn');
        const loginKeyInput = document.getElementById('login-key');
        const loginError = document.getElementById('login-error');
        const loginSpinner = document.getElementById('login-spinner');
        const loginBtnText = document.getElementById('login-btn-text');

        // Check if already authenticated
        if (sessionStorage.getItem('secureData')) {
            window.location.href = 'map.html';
        }

        loginBtn.addEventListener('click', async () => {
            const key = loginKeyInput.value.trim();
            if (!key) return;

            loginError.innerText = "";
            loginBtn.disabled = true;
            loginSpinner.classList.remove('hidden');
            loginBtnText.classList.add('hidden');

            try {
                const response = await fetch("data.enc");
                if (!response.ok) throw new Error("Fichier chiffré introuvable");
                const encryptedData = await response.text();

                // Decrypt using CryptoJS
                const decrypted = CryptoJS.AES.decrypt(encryptedData, key);
                const decryptedString = decrypted.toString(CryptoJS.enc.Utf8);

                if (!decryptedString) {
                    throw new Error("Clé incorrecte");
                }

                // Save to sessionStorage and redirect
                sessionStorage.setItem('secureData', decryptedString);
                window.location.href = 'map.html';

            } catch (err) {
                loginError.innerText = "Clé incorrecte ou erreur réseau.";
                loginBtn.disabled = false;
                loginSpinner.classList.add('hidden');
                loginBtnText.classList.remove('hidden');
            }
        });

        // Allow Enter key to submit
        loginKeyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });
    </script>
</body>

</html>
